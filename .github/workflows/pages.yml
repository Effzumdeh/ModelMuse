name: Deploy ModelMuse to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone artifact
        run: npm run build:standalone

      - name: Verify standalone artifact
        run: npm run verify:standalone

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp dist-standalone/modelmuse-standalone.html _site/index.html
          # Docs-Ablage: mehrsprachige Anwenderdoku koexistiert mit der App
          # (App: /index.html, Hilfe: /help/{de,en,es,fr}.html + shots/).
          mkdir -p _site/help
          cp docs/help/de.html docs/help/en.html docs/help/es.html docs/help/fr.html docs/help/index.html _site/help/
          cp -r docs/help/shots _site/help/shots
          # Lizenz-Audit versioniert mit ausliefern: der Standalone-Footer
          # verlinkt relativ auf docs/LICENSES.md (ab /index.html => /docs/LICENSES.md).
          # Ohne diese Datei liefe der Link auf Pages ins Leere (404).
          mkdir -p _site/docs
          cp docs/LICENSES.md _site/docs/LICENSES.md
          # Erklaervideos (04.11.2026, -180-Finalschnitt): der Standalone-Player
          # laedt je UI-Sprache ../docs/erklaervideo-{de,en,es,fr}-180.mp4.
          # Nur diese 4 Finals werden deployed (alle anderen MP4s bleiben lokal).
          cp docs/erklaervideo-de-180.mp4 docs/erklaervideo-en-180.mp4 docs/erklaervideo-es-180.mp4 docs/erklaervideo-fr-180.mp4 _site/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
